# Assets et fichiers statiques (a la racine du repo)
[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/components/*"
  to = "/components/:splat"
  status = 200

[[redirects]]
  from = "/pages/*"
  to = "/pages/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/favicon.svg"
  to = "/public/favicon.svg"
  status = 200

# Fallback SPA : toute autre URL charge l'index (le routeur client gere la 404)
[[redirects]]
  from = "/*"
  to = "/public/index.html"
  status = 200
