# Site statique : pas de build, tout le repo est publie (public/, css/, js/, etc.).
# Dans Netlify > Build & deploy : Publish directory = . (si "Not set", definir explicitement).
[build]
  publish = "."

# Nécessaire pour que Netlify Forms parse le HTML au déploiement
[build.processing]
  skip_processing = false

# Netlify Functions (backend serverless : capture leads -> Zoho CRM)
[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# === API : capture des leads (DOIT etre AVANT le fallback SPA /*) ===
[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200
  force = true

# === API : suivi des visites de la landing Lilmod (AVANT le fallback SPA /*) ===
[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200
  force = true

[[redirects]]
  from = "/api/visits"
  to = "/.netlify/functions/visits"
  status = 200
  force = true

