<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Netlify Forms — Lilmod</title>
</head>
<body>
    <!-- Page technique : enregistrement du formulaire Lilmod pour Netlify Forms (scan au déploiement). -->
    <form
        name="lilmod-rappel"
        method="POST"
        data-netlify="true"
        data-netlify-honeypot="bot-field"
        action="/lilmod-2e3f4a5"
    >
        <p style="display:none" aria-hidden="true">
            <label>Ne pas remplir <input name="bot-field"></label>
        </p>
        <input type="text" name="nom">
        <input type="tel" name="telephone">
        <input type="email" name="email">
        <input type="text" name="disponibilite">
        <input type="text" name="consent">
        <input type="text" name="source">
        <input type="text" name="page_url">
        <input type="text" name="message">
        <button type="submit">Envoyer</button>
    </form>
</body>
</html>
